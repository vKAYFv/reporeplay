services:
  app:
    build:
      target: build
    command: ["pnpm", "--filter", "@kayf/profile-counter-server", "dev"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/server/src:/workspace/apps/server/src
      - ./packages:/workspace/packages
    healthcheck:
      start_period: 20s
